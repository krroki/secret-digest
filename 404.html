/* 2026-10-19 «AI 티» 벗기기(사용자 «ai 티나는 ui 벗기는 방법 찾아보고 해줘»): 보라 브랜드·보라→분홍 그라데이션·무지개 종류색·
   둥근 알약 일색·카드마다 그림자·이모지 아이콘 = 생성형 UI 의 기본값(saasui.design·21st.dev·Anthropic frontend-design 스킬) →
   파랑 하나(행동만) + 회색 단계 · 종류색은 «일정»(마감이 있는 것)만 · 그림자는 떠 있는 것(탭·맨 위로)만 · 모서리 8~16px · Lucide 선 아이콘 */
:root{--bg:#f2f4f6;--sf:#fff;--sf2:#f2f4f6;--line:#e5e8eb;--tx:#191f28;--tx2:#4e5968;--tx3:#6b7684;

 --news:#4559c9;--news-s:#eceffe;--res:#0f8a8a;--res-s:#e2f5f4;--win:#0f9b57;--win-s:#e2f6eb;--ep:#d6409f;--ep-s:#fcebf5;
 --pass:#1b64da;--pass-tag:#e8f1ff}
body.dark{--bg:#101215;--sf:#1b1e23;--sf2:#24282e;--line:#30353d;--tx:#eef0f3;--tx2:#c1c7cf;--tx3:#8e97a3;
 --brand:#4f95ff;--brand-soft:#1b2a42;--shadow:none;
 --plan:#ff8085;--plan-s:#3a1f23;--notice:#ffa063;--notice-s:#3a2718;--q:#7eaaff;--q-s:#1c2741;--exp:#b8a2ff;--exp-s:#2a2344;
 --news:#95a2ff;--news-s:#212646;--res:#55d3c7;--res-s:#15302e;--win:#4fdc8a;--win-s:#14301f;--ep:#f78bc9;--ep-s:#3a1d30;
 --pass:#2457bd;--pass-tag:#e8f1ff}
.t-plan{--c:var(--plan);--c-s:var(--plan-s)}
.t-notice,.t-q,.t-exp,.t-news,.t-res,.t-win,.t-ep{--c:var(--tx2);--c-s:var(--sf2)}
html{-webkit-text-size-adjust:100%}

 background:var(--bg);color:var(--tx);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* 머리 — 한 줄(제목 · 기준 시각 · 테마) + 숫자 한 줄(칩 상자 없음 · 홈 C안 10-19) */
.top{display:flex;align-items:center;gap:10px;padding:12px 0 0}
.ic{width:1.15em;height:1.15em;flex:0 0 auto;vertical-align:-.2em}
.top h1{flex:1;min-width:0;font-size:17px;font-weight:800;letter-spacing:-.4px;line-height:1.3}
.asof{font-size:12.5px;color:var(--tx3);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.theme-btn{flex:0 0 40px;width:40px;height:40px;margin-right:-6px;border-radius:12px;border:0;background:transparent;color:var(--tx2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.top-meta{display:flex;flex-wrap:wrap;gap:2px 12px;margin:0 0 12px;font-size:12.5px;font-weight:500;color:var(--tx3);font-variant-numeric:tabular-nums}
.top-meta b{color:var(--tx2);font-weight:700}
/* 머리 숫자 판(10-20) — 카톡 N건 › 꿀팁 N개 · 숫자 주인공 */
.top-meta{display:block;margin:10px 0 14px;padding:14px 16px;border-radius:16px;background:var(--sf);border:1px solid var(--line)}
.sq{display:flex;align-items:center;gap:6px}

.top-meta .sq-n.hl b{color:var(--brand)}
.top-meta .sq-n.hl span{color:var(--brand)}
.sq-ar{width:22px;height:22px;color:var(--tx3);flex:0 0 auto}
.ps-plan .ps-pw{grid-row:1}
.lead{margin:-4px 0 8px;font-size:14px;line-height:1.5;color:var(--tx2)}.lead b{color:var(--tx);font-weight:700}

/* 오늘의 브리핑(홈 C안 10-19) — 흰 판 한 장 · 결론(큰 제목) → 숫자 → 번호 항목 → 그날 전체 · 줄 길이 40자 안(WCAG 1.4.8) */
.brief{background:var(--sf);border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px}
.br-k{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--brand)}
.br-free{font-size:11.5px;font-weight:800;color:var(--brand);background:var(--brand-soft);border-radius:6px;padding:1px 7px;line-height:1.6}
.br-d{margin-left:auto;font-size:12.5px;color:var(--tx3);font-weight:600}
.brief h2{margin-top:8px;font-size:22px;line-height:1.4;font-weight:800;letter-spacing:-.6px;max-width:40em}
.br-st{margin-top:6px;font-size:13.5px;color:var(--tx3);font-variant-numeric:tabular-nums}
.br-st b{color:var(--tx);font-weight:800}
.br-items{list-style:none;margin-top:12px;border-top:1px solid var(--line)}
.br-items li{border-bottom:1px solid var(--line)}
.br-it{display:grid;grid-template-columns:22px minmax(0,1fr);gap:1px 8px;padding:12px 0;color:var(--tx);text-decoration:none;max-width:42em}
.br-n{grid-row:span 2;font-size:16px;font-weight:800;color:var(--brand);line-height:1.5;font-variant-numeric:tabular-nums}
.br-kd{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--tx3)}
.br-kd .ic{width:14px;height:14px}
.br-t{font-size:16px;font-weight:600;line-height:1.5;letter-spacing:-.2px}
.br-it:hover .br-t{color:var(--brand)}
.br-all{display:flex;align-items:center;justify-content:center;gap:2px;width:100%;min-height:46px;margin-top:14px;border:0;border-radius:12px;background:var(--sf2);color:var(--tx);font-size:14.5px;font-weight:700;cursor:pointer}
.br-all .ic{color:var(--tx3)}

/* 이용권 칸(홈 C안 10-19) — 본문과 다른 물건: 파랑 바탕 한 장(그라데이션·빛 번짐 없음) · 종이 더미 · 큰 숫자 · 기간 단추 세로(추천만 흰 단추) */
.pass{margin-top:12px;border-radius:20px;padding:20px 18px 16px;background:var(--pass);color:#fff;overflow:hidden}
.ps-top{display:flex;gap:10px;align-items:flex-start}
.ps-hd{flex:1;min-width:0}
.ps-k{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;color:rgba(255,255,255,.8)}
.ps-k .ic{width:14px;height:14px}
.pass h2{margin-top:4px;font-size:24px;line-height:1.3;font-weight:800;letter-spacing:-.6px}
.ps-s{margin-top:4px;font-size:13.5px;color:rgba(255,255,255,.82);font-variant-numeric:tabular-nums}
.ps-stack{position:relative;flex:0 0 108px;height:104px;margin-right:-2px}
.pg{position:absolute;display:flex;flex-direction:column;justify-content:space-between;width:80px;height:56px;padding:6px 9px;border-radius:9px;background:#fff;color:#191f28;box-shadow:0 1px 0 rgba(0,0,0,.1),0 4px 10px rgba(0,25,80,.2)}
.pg-d{font-size:13px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.pg-n{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;font-weight:700;color:#6b7684}
.pg-n .ic{width:13px;height:13px;color:var(--pass)}
.pg0{right:0;top:0;transform:rotate(6deg)}
.pg1{right:10px;top:22px;transform:rotate(1deg)}
.pg2{right:20px;top:44px;transform:rotate(-4deg)}
.pg0 .pg-n,.pg1 .pg-n{visibility:hidden}
.ps-nums{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.ps-nums p{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.12);font-size:14px;font-weight:700}
.ps-nums span{display:block;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.8)}
.ps-nums b{font-size:24px;font-weight:800;letter-spacing:-.5px;margin-right:2px;font-variant-numeric:tabular-nums}
.ps-l{margin-top:16px;font-size:12.5px;font-weight:800;color:rgba(255,255,255,.72)}
.ps-exs{list-style:none;margin-top:4px}
.ps-exs li+li{border-top:1px solid rgba(255,255,255,.18)}
.ps-ex{display:flex;gap:8px;align-items:flex-start;width:100%;min-height:44px;padding:9px 0;border:0;background:transparent;color:#fff;font-size:14px;font-weight:600;line-height:1.5;text-align:left;cursor:pointer}
.ps-ex .ic{width:15px;height:15px;margin-top:.2em;opacity:.75}
.ps-ex small{display:block;font-size:12px;font-weight:700;color:rgba(255,255,255,.66)}
.ps-plans{display:grid;gap:8px;margin-top:12px}
.ps-plan{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:0 12px;width:100%;min-height:58px;padding:9px 16px;border:1.5px solid rgba(255,255,255,.5);border-radius:14px;background:transparent;color:#fff;text-align:left;cursor:pointer}
.ps-pn{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:700}
.ps-pn em{font-style:normal;font-size:11px;font-weight:800;color:var(--pass);background:var(--pass-tag);border-radius:5px;padding:1px 6px;line-height:1.6}
.ps-pd{grid-column:1;font-size:12.5px;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}
.ps-pw{grid-column:2;grid-row:1/span 2;font-size:20px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.ps-plan.rec{background:#fff;border-color:#fff;color:#191f28}
.ps-plan.rec .ps-pd{color:#6b7684}
.ps-note{margin-top:10px;font-size:12px;color:rgba(255,255,255,.8);text-align:center}
.pass :focus-visible{outline-color:#fff}

/* 디하북스 캐러셀 — 이용권 칸 아래 · 탭 위(홈 C안 10-19 · 제휴 칸은 본문·이용권과 따로) */
.dh{margin:20px 0 18px}
.dh-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px;font-size:13px;font-weight:700;color:var(--tx3)}
.dh-head span{display:inline-flex;align-items:center;gap:6px}
.dh-head a{color:var(--brand);text-decoration:none;font-weight:700;min-height:32px;display:inline-flex;align-items:center}
.dh-frame{position:relative}
.dh-track{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;border-radius:var(--r)}
.dh-track::-webkit-scrollbar{display:none}
.dh-slide{flex:0 0 100%;scroll-snap-align:start;display:block;border-radius:var(--r);overflow:hidden;background:#111}
.dh-slide img{display:block;width:100%;height:auto;aspect-ratio:1870/841;object-fit:cover}
.dh-ctrl{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:2px;background:rgba(0,0,0,.55);color:#fff;
 border-radius:999px;padding:2px 6px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.dh-btn{border:0;background:transparent;color:#fff;cursor:pointer;min-width:36px;min-height:36px;font-size:16px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
/* 넓은 화면도 한 장씩(아레나 r2 — 82% 폭이라 두 장이 걸쳐 보였고 조작 알약이 그림 밖으로 떨어졌다) */
.dh-dots{display:flex;justify-content:center;gap:5px;margin-top:9px}
.dh-dot{width:6px;height:6px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.dh-dot[aria-current="true"]{width:18px;border-radius:4px;background:var(--brand)}

/* 탭 — 붙박이 세그먼트 */
/* 붙는 머리(10-22 사용자 «스티키되는 헤더 두개 사이에 공간이 있어서 뒷 화면이 보여»): 탭 바를 본문 폭 받침(tab-dock) 하나에 넣어 받침이 붙는다.
   받침 높이 = --tab-h 하나(탭 바는 그 높이를 채움) · 정렬 띠 top 도 같은 --tab-h — 둘이 같은 값이라 틈이 생길 수 없다.
   옛 판: 탭 바 실제 높이 52px · 정렬 띠 top 58px 고정 → 6px 틈 + 탭 바 양옆(16px)·둥근 아래 모서리로 뒤 글이 비쳤다(실측 2026-10-22 390/1440 · 밝게/어둡게). */
:root{--tab-h:62px}
.tab-dock{position:sticky;top:0;z-index:30;height:var(--tab-h);margin:0 -16px;padding:0 14px;background:var(--bg)}
.tab-dock::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:10px;background:var(--bg)}
.tab-bar{display:flex;gap:4px;height:100%;padding:4px;background:var(--sf);border:1px solid var(--line);
 border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.tab-btn{position:relative;z-index:1;flex:1;min-height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border:0;border-radius:10px;
 background:transparent;font-size:14px;font-weight:700;line-height:1.15;letter-spacing:-.3px;color:var(--tx2);cursor:pointer}
.tab-btn.active{background:var(--brand-soft);color:var(--brand)}
/* 탭 숫자 줄 · 시안 D(2026-10-25 사용자 «들어와도 지금뜨는 탭까지는 잘 안눌러보는거같은데 약간의 모션이랑 색감 넣어서 눌러보게끔 해보자» → 18:28 «1» · 시안 = arena-r6-sales/tabs-motion):
   이름 밑 숫자 한 줄(회색 하나 · 아래 브리핑 막대 4색과 겹침 없음) · «지금 뜨는» 숫자만 빨강 + 앞 빨간 점(처음 고리 한 번) · 고른 탭 표시(tm-ind)가 누른 탭으로 미끄러짐(0.28초).
   탭 막대 높이 = --tab-h 62(한 곳). 고른 탭 바탕은 JS 가 미끄러지는 표시를 놓은 뒤(tm-ok)부터 그 표시가 맡는다 — JS 전엔 옛 바탕 그대로. */
.tab-bar{position:relative}
.tab-bar.tm-ok .tab-btn.active{background:transparent}
.tm-sub{display:block;font-size:11.5px;font-weight:700;letter-spacing:-.2px;font-variant-numeric:tabular-nums;color:var(--tx3);white-space:nowrap}
.tm-ind{position:absolute;z-index:0;top:4px;bottom:4px;left:0;width:0;border-radius:10px;background:var(--brand-soft);pointer-events:none}
html.mo .tm-ind.tm-go{transition:transform .28s cubic-bezier(.3,.7,.2,1),width .28s cubic-bezier(.3,.7,.2,1)}
/* 움직임이 있는 판은 첫 재생 전 숫자 줄을 숨긴다 — 안 숨기면 «값 → 사라짐 → 0부터 올라감»으로 한 번 깜빡였다(시안 실측).
   숨김 표식 = tmh(body 첫 스크립트가 mo 와 같은 조건으로 붙임): mo 는 본문 끝 JS 가 붙여 5MB 쪽을 다 읽는 1~2초 동안 숫자가 보였다가 사라졌다(격리 렌더 실측 10-26) ·
   JS 없음·움직임 줄이기·?audit·?still = tmh 없음 = 처음부터 보임 · 재생이 없는 판이면 탭 JS 가 바로 tm-seen */
html.tmh .tab-bar:not(.tm-seen) .tm-sub{opacity:0}
@keyframes tm-up{0%{opacity:0;transform:translateY(5px)}100%{opacity:1;transform:none}}
html.mo .tab-bar.tm-play .tm-sub{animation:tm-up .35s ease-out both}
html.mo .tab-bar.tm-play .tab-btn:nth-child(3) .tm-sub{animation-delay:.08s}
html.mo .tab-bar.tm-play .tab-btn:nth-child(4) .tm-sub{animation-delay:.16s}
html.mo .tab-bar.tm-play .tab-btn:nth-child(5) .tm-sub{animation-delay:.24s}
/* 좁은 폰(375 미만): 점 + «1위 +11.9만»이 칸(66px)보다 길어 지금 뜨는 칸만 넓어졌다(시안 실측 320 = 66·72·66·66) → 숫자 줄 글자·점 간격을 줄인다 */
@media (max-width:374px){.tm-sub{font-size:10.5px;letter-spacing:-.3px}}
@media (prefers-reduced-motion:reduce){.tab-bar.tm-play .tm-sub{animation:none!important}.tm-ind{transition:none!important}}
/* 10-23 #94 탭 가볍게: 아직 안 연 탭 = display:none(첫 화면 비용 그대로 · 처음부터 hidden 으로 두면 숨은 탭 스타일까지 첫 화면에 계산해 더 느렸다 실측) ·
   한 번 연 탭(.seen)은 숨겨도 content-visibility:hidden 으로 배치를 간직 → 다시 열 때 처음부터 배치·글자 모양 잡기를 안 한다(폰 흉내 날짜별 다시 열기 1.3초 → 0.3초) */
.tab-content{display:none}.tab-content.seen{display:block;content-visibility:hidden}.tab-content.active{display:block;content-visibility:visible}

/* 구역 */
.sec{margin-top:28px}
.sec-h{display:flex;align-items:center;gap:7px;margin:0 2px 10px}
.sec-ic{font-size:18px;color:var(--tx2);display:inline-flex}
.sec-h h2{font-size:18px;font-weight:800;letter-spacing:-.4px}
.sec-n{font-size:13px;font-weight:800;color:var(--tx3)}
.sec-more{margin-left:auto;border:0;background:none;font-size:13.5px;font-weight:700;color:var(--brand);cursor:pointer;min-height:36px;padding:0 2px}

/* 카드 */
.card,.qa-card{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card{padding:16px 16px 6px}
.card+.card,.card+.qa-card,.qa-card+.card,.qa-card+.qa-card,.dl-card+.card{margin-top:10px}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--c-s);color:var(--c);white-space:nowrap}
.when{margin-left:auto;font-size:12.5px;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap}
.card h3{font-size:16px;font-weight:800;line-height:1.45;letter-spacing:-.3px}
.card p{font-size:14.5px;color:var(--tx2);margin-top:4px}
.card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:12px;font-size:13px;color:var(--tx3)}
.who{font-weight:700;color:var(--tx)}
.rly{margin-left:4px;color:var(--tx2);font-weight:400}
.tm{color:var(--tx3);font-variant-numeric:tabular-nums}
.k{font-size:11px;font-weight:700;color:var(--tx3);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.rb{display:inline-block;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--q-s);color:var(--q);line-height:1.4}
.rb.sub{background:var(--win-s);color:var(--win)}.rb-orange{background:var(--notice-s);color:var(--notice)}.rb-purple{background:var(--exp-s);color:var(--exp)}
.jump{margin-left:auto;font-size:13.5px;font-weight:700;color:var(--brand);text-decoration:none;display:inline-flex;align-items:center;min-height:44px;padding:0 2px}
.raw{font-size:13px;color:var(--tx3);margin-top:6px}
.win-val{font-size:22px;font-weight:900;color:var(--win);line-height:1.3;letter-spacing:-.4px;margin-bottom:2px}
.subj{font-size:13px;color:var(--tx3);margin-top:8px;display:flex;align-items:center;gap:6px}
/* 다시 쓴 인사이트(deepen) — 한 줄 결론 + 점 */
.card h3.hook{font-size:17px;line-height:1.45}
.hot{display:inline-block;vertical-align:2px;margin-right:6px;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--win-s);color:var(--win)}
.pts{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:7px}
.pts li{display:grid;grid-template-columns:42px 1fr;gap:8px;align-items:baseline;font-size:14.5px;line-height:1.55;color:var(--tx2)}
.pts .pk{font-size:11.5px;font-weight:800;text-align:center;padding:2px 0;border-radius:6px;background:var(--c-s);color:var(--c)}
.pts .pk-1 .pk{background:var(--win-s);color:var(--win)}
.pts .pk-4 .pk{background:var(--notice-s);color:var(--notice)}
/* 맛보기 판(--lock) — 잠긴 카드 · 맨 위 안내 띠 · 결제 창 */
.card.locked{padding-bottom:12px}
.card.locked .card-meta{margin-top:8px}
.lockline{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin-top:10px;padding:8px 12px;border:1px dashed var(--line);border-radius:10px;background:transparent;color:var(--tx2);font:inherit;font-size:13.5px;text-align:left;cursor:pointer}
.lockline .lk-t{flex:1;min-width:0}
.lockline .lk-go{font-weight:800;color:var(--brand);white-space:nowrap}
.qa-card.locked .qa-body .lockline{margin:4px 0 12px}
/* 10-23 #100 D2 안1(사용자 #105): 날짜별 탭 잠긴 날(.day-accordion.lk) = 구역마다 «시각 · 제목 · 자물쇠» 한 줄 목록(한 판) · 그날 끝 «구독하고 바로 보기» 하나.
   카드 DOM 은 그대로(찾기 복제·바로가기·셈이 같은 카드) — 줄 전체를 카드 안 잠금 줄(.lockline · data-pay)이 덮어 누르면 결제 창 · 보이는 자물쇠 = 그 줄의 아이콘 */
.lk-tm,.lk-q{display:none}
.day-accordion.lk .gcards,.day-accordion.lk .fold.cert .gcards{display:block;padding:0 14px;background:var(--sf);border:1px solid var(--line);border-radius:var(--r)}
.day-accordion.lk .gcards>.card.locked,.day-accordion.lk .gcards>.qa-card.locked{position:relative;display:flex;align-items:center;gap:10px;min-height:52px;margin:0;padding:10px 34px 10px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;box-shadow:none;background:transparent}
.day-accordion.lk .gcards>.locked:last-child{border-bottom:0}
.day-accordion.lk .card.locked>:not(h3):not(.lk-tm):not(.lockline),.day-accordion.lk .qa-card.locked>:not(.lk-tm):not(.lk-q):not(.qa-body){display:none}
.day-accordion.lk .lk-tm{display:block;flex:none;order:-1;font-size:13px;color:var(--tx3);font-variant-numeric:tabular-nums}
.day-accordion.lk .card.locked h3,.day-accordion.lk .lk-q{display:block;flex:1;min-width:0;margin:0;font-size:14.5px;font-weight:600;line-height:1.4;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.day-accordion.lk .qa-card.locked .qa-body{display:block;position:static;padding:0}
.day-accordion.lk .locked .lockline{position:absolute;inset:0;z-index:1;width:auto;min-height:0;margin:0;padding:0 2px 0 0;border:0;border-radius:0;background:transparent;justify-content:flex-end;color:var(--tx3)}
.day-accordion.lk .locked .lockline .lk-t,.day-accordion.lk .locked .lockline .lk-go{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.day-accordion.lk .lk-all{margin-top:14px}
.sec-sub{margin:-6px 2px 10px;font-size:13px;color:var(--tx3)}
.lockmore{margin-top:4px;background:var(--sf)}
/* 결제 창(2026-10-19 PC 위치·디자인 개선): 전역 리셋 *{margin:0} 이 dialog 의 margin:auto(가운데)를 지웠다 → 여기서 되살린다.
   PC = 가운데 카드 · 휴대폰(≤560px) = 아래에서 올라오는 시트 · 그림자 대신 뒷배경만 어둡게 */
.pay{border:0;padding:0;margin:auto;border-radius:20px;width:min(400px,calc(100vw - 32px));max-width:none;max-height:calc(100dvh - 32px);overflow:auto;background:var(--sf);color:var(--tx)}
.pay::backdrop{background:rgba(0,0,0,.5)}
@media (max-width:560px){.pay{margin:auto 0 0;width:100vw;max-height:calc(100dvh - 24px);border-radius:20px 20px 0 0}.pay-in{padding-bottom:calc(16px + env(safe-area-inset-bottom))}}
.pay-in{padding:18px 20px 16px}
.pay-hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pay-k{font-size:13px;font-weight:700;color:var(--tx3)}
.pay-x{flex:none;width:40px;height:40px;margin:-8px -10px -8px 0;border:0;border-radius:10px;background:transparent;color:var(--tx3);cursor:pointer;display:flex;align-items:center;justify-content:center}
.pay-x .ic{width:20px;height:20px}
.pay h2{margin-top:4px;font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.35}
.pay-free{margin-top:6px;font-size:14.5px;color:var(--tx2)}
.pay-gets{list-style:none;margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--sf2);display:grid;gap:8px}
.pay-gets li{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--tx2)}
.pay-gets li .ic{flex:none;width:18px;height:18px;color:var(--tx3)}
.pay-gets li b{margin-left:auto;color:var(--tx);font-weight:800}
.plans{display:grid;gap:8px;margin-top:16px}
.plan{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:12px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--sf);color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.plan.on{border-color:var(--brand);background:var(--brand-soft)}
.plan:focus-visible,.pay-go:focus-visible,.pay-restore:focus-visible,.pay-x:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.pl-dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);background:var(--sf)}
.plan.on .pl-dot{border:6px solid var(--brand)}
.pl-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.plan1{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 16px;border:1.5px solid var(--brand);border-radius:12px;background:var(--brand-soft);color:var(--tx)}
.pl-n{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700}
.pl-tag{font-style:normal;font-size:11.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--brand-soft);color:var(--brand)}
.plan.on .pl-tag{background:var(--sf)}
.pl-s{font-size:13px;color:var(--tx3)}
.pl-w{flex:none;font-size:18px;font-weight:800;letter-spacing:-.3px}
.pay-go{display:block;width:100%;min-height:52px;margin-top:16px;border:0;border-radius:12px;background:var(--brand);color:#fff;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
body.dark .pay-go{color:#0b0d11}
.pay-note{margin-top:10px;font-size:12.5px;color:var(--tx3);text-align:center}
.pay-links{display:flex;align-items:center;justify-content:center;gap:4px;margin-top:2px;color:var(--tx3)}
.pay-restore{display:block;min-height:44px;padding:0 8px;border:0;background:transparent;color:var(--tx2);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* 10-23 #100 R1: 결제 결과 안내 = 창 맨 위 · 16px 굵게 · 글색은 본문색(주황 바탕 띠 + 왼쪽 굵은 선) — 옛: 맨 아래 13.5px 보통 굵기 주황 글 */
.pay-msg{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--notice-s);border-left:4px solid var(--notice);color:var(--tx);font-size:16px;font-weight:700;line-height:1.45}
/* 10-23 #94 C002: 여는 중 = 가운데 카드(돌기 · «구독 확인됨 · 여는 중» · 단계 · 막대) · 새 문서를 그리는 동안(.drawing)은 바탕을 막아 위에서부터 조립되는 화면 대신 카드만 */
.unlock-ov{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.45)}
.unlock-ov[hidden]{display:none}
.unlock-ov.drawing{background:var(--bg)}
.uo-card{width:min(320px,100%);padding:26px 22px 22px;border-radius:20px;background:var(--sf);color:var(--tx);box-shadow:0 12px 40px rgba(0,0,0,.25);text-align:center}
.unlock-ov .uo-spin{width:40px;height:40px;color:var(--brand);animation:uo-rot 1s linear infinite}
@keyframes uo-rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.unlock-ov .uo-spin{animation:none}}
.uo-h{margin:12px 0 6px;font-size:19px;font-weight:800;line-height:1.35}
.uo-st{margin:0 0 14px;font-size:14px;font-weight:600;color:var(--tx2);font-variant-numeric:tabular-nums}
.uo-bar{height:8px;border-radius:99px;background:var(--sf2);overflow:hidden}
.uo-bar>i{display:block;height:100%;width:0;border-radius:inherit;background:var(--brand);transition:width .2s ease}
/* 일정 */
.dl-card{border-color:var(--plan-s);padding-top:14px}
.dl-top{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.dl-k{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;background:var(--plan-s);color:var(--plan)}
.dl-remain{font-size:24px;font-weight:900;color:var(--plan);letter-spacing:-.5px;line-height:1.2}
.dl-when{font-size:14px;font-weight:700;color:var(--tx);margin:2px 0 12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.dl-when.nt,.dl-state .nt{font-weight:600;color:var(--notice)}
.dl-only{margin-bottom:12px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.dl-multi{font-size:12px;font-weight:700;color:var(--tx3);margin:-2px 0 8px}
.dl-item+.dl-item{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.dl-state{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:14px;font-weight:800;margin-bottom:6px}
.dl-state.up{color:var(--plan)}
.dl-state.past{color:var(--tx3);font-weight:600;font-size:13px}
.dl-rem-s{font-size:14px;font-weight:800;color:var(--plan)}
/* 주소 버튼 */
.url-list{margin-top:10px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.url-card{display:flex;align-items:center;gap:10px;min-height:46px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--sf2);text-decoration:none;color:var(--tx)}
.link-icon{flex:0 0 auto;font-size:15px;color:var(--tx3)}
.link-body{flex:1;min-width:0}
.link-title,.link-url,.link-meta{display:block}
.link-title{font-size:13.5px;font-weight:600;line-height:1.45}
.link-url{font-size:12px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-meta{font-size:12px;color:var(--tx3);display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-bottom:2px}
.url-fold>summary{list-style:none;display:inline-flex;align-items:center;gap:4px;min-height:40px;margin-top:4px;padding:0 4px;font-size:13.5px;font-weight:700;color:var(--brand);cursor:pointer}
.url-fold>summary::-webkit-details-marker{display:none}
.url-fold>summary::before{content:"";width:14px;height:14px;flex:0 0 14px;background:currentColor;-webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m9%2018%206-6-6-6%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22black%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22m9%2018%206-6-6-6%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat;transition:transform .2s}
.url-fold[open]>summary::before{transform:rotate(90deg)}
.link-title{display:-webkit-box!important;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.url-card:hover{border-color:var(--brand)}
/* 질문 카드 */
.qa-card{overflow:hidden}
.qa-header{display:flex;align-items:flex-start;gap:12px;width:100%;padding:15px 16px;border:0;background:none;text-align:left;cursor:pointer}
.qa-q-icon{flex:0 0 28px;height:28px;border-radius:9px;background:var(--q-s);color:var(--q);font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}
.qa-question{flex:1;min-width:0;display:block;font-size:15.5px;font-weight:800;line-height:1.45;letter-spacing:-.3px}
.qa-sub{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:6px;font-size:12.5px;font-weight:500;color:var(--tx3)}
.qa-asker{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.qa-n{font-weight:800;color:var(--q)}
.st{font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px}
.st-ok{background:var(--win-s);color:var(--win)}
.qa-toggle{flex:0 0 auto;color:var(--tx3);font-size:14px;padding-top:4px;transition:transform .2s}
.qa-card.open .qa-toggle{transform:rotate(180deg)}
.qa-body{display:none;padding:0 16px 8px 56px}
.qa-card.open .qa-body{display:block}
.qa-ask{margin-bottom:8px}
.qa-ask-k{font-size:11.5px;font-weight:800;color:var(--tx3);margin-bottom:2px}
.qa-ask p{font-size:14.5px;color:var(--tx2)}
.qa-answer{background:var(--sf2);border-left:3px solid var(--q);border-radius:4px 12px 12px 4px;padding:10px 12px;margin-top:8px}
.qa-answer-header{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13px}
.qa-answer-name{font-weight:800}
.qa-answer-header .tm{font-size:12px}
.qa-answer p{font-size:14.5px;color:var(--tx2);margin-top:2px}
.lk{font-size:11px;font-weight:600;color:var(--tx3);border:1px dashed var(--tx3);border-radius:6px;padding:1px 6px}
.qa-foot{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:0 12px}
.qa-jump{display:flex;align-items:center;min-height:44px}
@media (max-width:520px){.qa-body{padding-left:16px}}

/* 지난 날짜(한눈에 보기 첫 구역) · 날짜별 종류 알약 */
.tchips{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 2px}
.tchip{font-size:12.5px;font-weight:700;min-height:32px;padding:0 10px;border:0;border-radius:8px;background:var(--c-s);color:var(--c);cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.tchip b{font-weight:900}
.prev{margin-top:0;background:var(--sf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.prev-row{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 16px;border:0;background:none;text-align:left;cursor:pointer}
.prev-row+.prev-row{border-top:1px solid var(--line)}
.prev-row:hover{background:var(--sf2)}
.prev-d{flex:0 0 auto;min-width:44px;font-size:14.5px;font-weight:800;line-height:1.35;font-variant-numeric:tabular-nums}
.prev-d small{display:block;font-size:12px;font-weight:600;color:var(--tx3)}
.prev-hl{flex:1;min-width:0;font-size:14px;line-height:1.45;color:var(--tx2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.prev-n{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:var(--tx3);font-variant-numeric:tabular-nums}
.prev-n .ic{width:14px;height:14px}
.chev{flex:0 0 auto;color:var(--tx3);font-size:18px;line-height:1}

/* 날짜별 */
.week-h{font-size:13px;font-weight:800;color:var(--tx3);margin:24px 4px 8px}
.week-h:first-child{margin-top:20px}
/* 10-23 #94 C053(구독자 10/20 펼치면 57,259px · 접으려면 한참 올라감): 펼친 날 머리를 탭 받침 + 날짜별 정렬 띠 아래에 붙인다.
   overflow hidden 은 붙는 머리를 막아(가장 가까운 스크롤 상자가 됨) clip 으로(둥근 모서리 자르기는 같다) · 정렬 띠·머리 높이는 JS(stick)가 재어 --sort-h·--dh 로 */
.day-accordion{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-top:8px;overflow:clip;scroll-margin-top:calc(var(--tab-h) + var(--sort-h) + 8px)}
.day-accordion.open>.day-accordion-header{position:sticky;top:calc(var(--tab-h) + var(--sort-h));z-index:15;background:var(--sf);border-radius:var(--r) var(--r) 0 0}
#tab-days .day-accordion-body [data-item],#tab-days .day-accordion-body [id]{scroll-margin-top:calc(var(--tab-h) + var(--sort-h) + var(--dh) + 8px)}
.day-accordion-header{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border:0;background:none;text-align:left;cursor:pointer}
.dcal{flex:0 0 50px;height:56px;border-radius:12px;background:var(--sf2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.dcal b{font-size:20px;font-weight:900}
.dcal span{font-size:11px;font-weight:700;color:var(--tx3)}
.day-accordion.latest .dcal{background:var(--brand);color:#fff}
.day-accordion.latest .dcal span{color:rgba(255,255,255,.85)}
.dsum{flex:1;min-width:0;display:block}
.das-top{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}
.day-accordion-date{font-size:13px;font-weight:800;color:var(--tx2)}
.day-accordion-badge{font-size:11px;font-weight:800;color:var(--brand);background:var(--brand-soft);padding:1px 7px;border-radius:6px}

/* 찾기 */

.ev>summary::-webkit-details-marker,.long>summary::-webkit-details-marker,.link-fold>summary::-webkit-details-marker{display:none}

/* 건너뛰기 줄 */
.jumps{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:16px -16px 0;padding:0 16px}

.sec[id]{scroll-margin-top:calc(var(--tab-h) + 20px)}
/* 2차 공통 */
.t-plan,.t-notice{--c:var(--plan);--c-s:var(--plan-s)}.t-q{--c:var(--q);--c-s:var(--q-s)}.t-exp,.t-res,.t-win{--c:var(--win);--c-s:var(--win-s)}.t-news,.t-ep{--c:var(--tx2);--c-s:var(--sf2)}
.br-lab{margin-top:10px;font-size:12.5px;font-weight:700;color:var(--tx3)}
.brief h2{margin-top:2px}
.br-it{grid-template-columns:auto minmax(0,1fr);align-items:start;gap:2px 10px}
.br-pill{grid-row:span 2;display:inline-flex;align-items:center;gap:3px;min-width:58px;justify-content:center;padding:3px 7px;border-radius:7px;background:var(--c-s);color:var(--c);font-size:12.5px;font-weight:800;margin-top:2px}

.mx{display:inline-flex;align-items:center;gap:4px}.mx i{width:7px;height:7px;border-radius:2px}.mx b{color:var(--tx2);font-weight:800}
.g-plan i{background:var(--plan)}.g-ins i{background:var(--win)}.g-q i{background:var(--q)}
.rws{list-style:none;margin:0;padding:0 14px;border-radius:var(--r);background:var(--sf);border:1px solid var(--line)}
.rws li+li{border-top:1px solid var(--line)}
.rw{display:flex;align-items:center;gap:12px;padding:12px 0;color:var(--tx);text-decoration:none}

.rw-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

.rw-c b{font-size:15px;font-weight:800;line-height:1.2}.rw-c small{font-size:11px;font-weight:700}
.rw-c .ic{width:17px;height:17px}
.rw-dd.now{background:var(--plan);color:#fff}
.rws+.lockline{margin-top:10px}
/* 모션(2026-10-19 · html.mo 일 때만 · 움직임 줄이기면 JS 가 mo 를 안 붙인다) */
.rw,.prev-row,.br-it,.ps-plan,.jchip,.tab-btn,.br-all,.lockline,.more-btn,.sec-more,.pay-go,.chip,.day-accordion-header,.qa-header,.dh-card{transition:transform .12s ease,background-color .15s ease}
html.mo .rw:active,html.mo .prev-row:active,html.mo .br-it:active,html.mo .ps-plan:active,html.mo .jchip:active,html.mo .tab-btn:active,html.mo .br-all:active,html.mo .lockline:active,html.mo .more-btn:active,html.mo .sec-more:active,html.mo .pay-go:active,html.mo .chip:active,html.mo .day-accordion-header:active,html.mo .qa-header:active{transform:scale(.98)}
html.mo .tab-content.active{animation:mo-in .24s cubic-bezier(.2,.8,.2,1) both}

html.mo .pay[open]::backdrop{animation:mo-fade .22s ease-out both}
@keyframes mo-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes mo-sheet{from{opacity:0;transform:translateY(28px) scale(.98)}to{opacity:1;transform:none}}
@keyframes mo-fade{from{opacity:0}to{opacity:1}}

/* 10-23 #94 탭 가볍게: 날짜별 카드는 화면 가까이 올 때 배치(content-visibility:auto) — 열린 날 하나가 카드 수백 장(구독자 10/20 = 57,259px)이라 탭 열기·날 펴기가 화면 밖 카드까지 다 배치했다.
   크기 어림 = 실측 중앙값(내용 상자 높이 = 테두리·안쪽 여백 뺀 값 · contain-intrinsic-size 는 내용 상자 크기라 여백이 더해진다 — 테두리 상자 값이면 칸이 커진다 · 카드 388 · 질문 153) ·
   auto = 한 번 그린 카드는 실제 크기를 기억 · 찾기 결과 복제(#findResults)는 data-item 이 없어 해당 없음.
   잠긴 카드(.locked = 결제 들머리)는 뺀다: 그리기 전 칸은 눌러도 안쪽 잠금 줄 단추에 안 닿는다(건너뛴 내용은 누름 대상 밖 · 내려 보이자마자 누르면 결제 창이 안 열림 = test_r5_ux d2 실측) ·
   잠긴 줄은 한 줄이라 배치 값이 작다(빼고 넣고 4배 3회 중앙: 잠긴 날 펴기 105 ↔ 113ms · 날짜별 탭 502 ↔ 541ms = 차이 없음) */
.gcards>[data-item]:not(.locked){content-visibility:auto;contain-intrinsic-size:auto 388px}
.gcards>.qa-card[data-item]:not(.locked){contain-intrinsic-size:auto 153px}
/* 뛰기·자리 되살리기 직전 그 자리 위 카드만 잠깐 그린다(realAbove · 어림 크기 때문에 뛴 뒤 자리가 밀리지 않게) */
